<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qeydiyyatdan keçin</title>
    <link rel="stylesheet" href="register.css">
  </head>
  
  <body>
    <main>
      
      <!-- Register qutusu yaratmaq -->
      <div class="register-card">
        <div class="register-logo"></div>
          <div class="register-icon"></div>
        
      
      <!-- register bashliq üçün -->

      <div class="r-one">
        <h1>Qeydiyyatdan keçin</h1>
      </div>
      
      <!-- register forma -->
      <form action="first-form" method="FORM">
        
        <!-- register xanasi -->

        <div class="r-two">
          <label for="">Email</label>
          <input type="email" id="email" />
        </div>
        <br />
        <div class="r-three">
          <label for="">Password</label>
          <input type="password" id="password" /> <br /><br />
          <label for="">Password again</label>
          <input type="password" id="password" />
        </div>
        
        <!-- Adlar xanasi -->

        <div class="r-four">
          <label for="">First name</label>
          <input type="name" id="f-name" />
        </div>
        <div class="r-five">
          <label for="">Last name</label>
          <input type="name" id="l-name" />
        </div>
        <div class="r-six"> 
          <label for="">Date of birth</label> <br />
          <input type="date" name="" id="" />
        </div>
          
        <!-- Sertleri qebul etme bolmesi -->

        <div class="r-seven">
          <input type="checkbox" />
          <span class="sp-one">I accept Terms and Conditions</span>
        </div>
        <div class="r-eight">
          <button>Create account</button>
        </div>
      </form>
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hesabınıza daxil olun</title>
  </head>
  <link rel="stylesheet" href="login.css" />
  <body>
    <main>
        <div class="login-card">
    <!-- Loqo ve layihe adi -->
     <div class="logo-header">
        <div class="logo-icon"></div>
        <!-- <span class="logo-text">Mənim Layihəm</span>  -->
     </div>
<!-- Başlıqlar -->
 <div class="box0">
        <h1>Hesabınıza daxil olun</h1>
     <p class="box1">Davam etmək üçün mail və parolunuzu daxil edin</p>
 </div>
     
    <!-- Forma     -->
     <form action="diyez" method="POST">
<div class="box2">
    <label for="email">E-poçt</label>
    <input type="email" id="email" placeholder="Mailinizi daxil edin" required>
    </div>
    <!-- Parol xanası -->
     <div class="box3">
        <label for="password">Parol</label>
        <input type="password" id="password" placeholder="Parolunuzu daxil edin" required>
     </div>
     <!-- Meni xatirla ve ya parolu unutmusuzmu? -->
      <div class="box4">
        <label class="remember me">
            <input type="checkbox">
            <span>Məni xatırla</span>
        </label>
        <a href="#" class="">Parolu unutmusuz?</a>
      </div>
      <!-- Daxil ol duymesi -->
       <div class="box5">
    <button type="" class="">Daxil ol</button>
</div>
       
    </form>

       <!-- Ayeica xett  -->
     <div class="divider">
        <span>və ya</span>
     </div>
     <!-- qeydiyyat linki -->
      <p class="register-text">
        Hesabınız yoxdur? <a href="register.html" class="register-link">Qeydiyyatdan keçin</a>
      </p>
    
    </div>


      
    </main>
  </body>
</html>
